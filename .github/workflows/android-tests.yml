name: Android tests

on:
  push:
    branches: [master]

env:
  CI: true
  GITHUB_TOKEN: ${{ github.token }}
  # capture-website pulls in puppeteer; CI doesn't generate previews, so skip its Chrome download.
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  android-tests:
    environment: android
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            package: org.mozilla.firefox
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    env:
      RESULT_BASENAME: ${{ matrix.browser }}-android
      GOOGLE_PLAY_EMAIL: ${{ secrets.GOOGLE_PLAY_EMAIL }}
      AAS_TOKEN: ${{ secrets.AAS_TOKEN }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_SESSION_NAME: ${{ matrix.browser }}-android
      BROWSERSTACK_APP_CUSTOM_ID: privacytests-${{ matrix.browser }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install apkeep
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/apkeep" \
            https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-x86_64-unknown-linux-gnu
          chmod +x "$HOME/.local/bin/apkeep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/apkeep" --version

      - name: Download APK from Google Play
        run: |
          if [ -z "$GOOGLE_PLAY_EMAIL" ] || [ -z "$AAS_TOKEN" ]; then
            echo "Missing GOOGLE_PLAY_EMAIL and/or AAS_TOKEN secrets" >&2
            exit 1
          fi
          mkdir -p /tmp/apks
          apkeep -a "${{ matrix.package }}" -d google-play \
            -e "$GOOGLE_PLAY_EMAIL" -t "$AAS_TOKEN" \
            --accept-tos \
            /tmp/apks
          ls -la /tmp/apks
          APK="$(find /tmp/apks -maxdepth 1 \( -name '*.apk' -o -name '*.xapk' \) | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK downloaded for ${{ matrix.package }}" >&2
            exit 1
          fi
          echo "Downloaded: $APK"
          echo "BROWSERSTACK_APP_APK=$APK" >> "$GITHUB_ENV"

      - name: Run Android BrowserStack tests
        run: node test --android --browserstack --browser=${{ matrix.browser }} --out=../${{ env.RESULT_BASENAME }}.json
        timeout-minutes: 90

      - name: Upload results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ env.RESULT_BASENAME }}-1-results
          path: |
            ${{ env.RESULT_BASENAME }}.json
            ${{ env.RESULT_BASENAME }}.html
            failure.png
          if-no-files-found: warn
